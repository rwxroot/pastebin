{% extends "base.html" %}

{% block title %}New Paste — Pastebin{% endblock %}

{% block content %}
<form id="paste-form">
    <textarea name="content" required autofocus></textarea>
    <label for="expiry">Expire after</label>
    <select id="expiry" name="expires_in">
        <option value="">Never</option>
        <option value="1">1 hour</option>
        <option value="24" selected>1 day</option>
        <option value="168">1 week</option>
        <option value="720">1 month</option>
    </select>
    <div id="error"></div>
    <button type="submit" id="submit-btn">Paste</button>
</form>

<script>
    const form = document.getElementById('paste-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorDiv = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        errorDiv.style.display = 'none';

        const content = form.content.value;
        const expiry = form.expires_in.value; // already in hours

        const body = { content };
        if (expiry) body.expires_in = Number(expiry);

        try {
            const response = await fetch('/api/paste', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (response.ok) {
                const data = await response.json();
                window.location.href = '/fetch/' + data.id;
            } else {
                errorDiv.textContent = 'Failed to create paste.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
            }
        } catch (err) {
            errorDiv.textContent = 'Network error.';
            errorDiv.style.display = 'block';
            submitBtn.disabled = false;
        }
    });
</script>
{% endblock %}
