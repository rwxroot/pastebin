[package]
name = "pastebin"
version = "0.1.0"
edition = "2024"


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
axum = { version = "0.8.9", default-features = false, features = [
	"json",
	"tokio",
	"http1",

] }
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
dotenvy = { version = "0.15.7", default-features = false }
nanoid = { version = "0.5.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = [
	"chrono",
	"macros",
	"sqlite",
	"migrate",
	"runtime-tokio",
	"tls-rustls-ring-webpki",
] }
tokio = { version = "1.53.1", default-features = false, features = [
	"rt-multi-thread",
] }
tower-http = { version = "0.7.1", default-features = false, features = [
	"trace",
	"timeout",
	"request-id",
] }
tracing = { version = "0.1.44", default-features = false, features = [
	"log",
	"attributes",
] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
	"ansi",
	"env-filter",
] }
validator = { version = "0.21", default-features = false, features = [
	"derive",
] }

[dev-dependencies]
tower = { version = "0.5.3", default-features = false, features = ["util"] }
